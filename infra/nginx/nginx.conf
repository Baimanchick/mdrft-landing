user nginx;
worker_processes 1;
worker_rlimit_nofile 4096;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 512;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format structured escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
  access_log /dev/stdout structured;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  keepalive_requests 100;
  client_header_timeout 10s;
  client_body_timeout 10s;
  reset_timedout_connection on;

  gzip on;
  gzip_comp_level 4;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain;

  limit_req_zone $binary_remote_addr zone=lead_api:1m rate=30r/m;
  limit_req_status 429;

  include /etc/nginx/conf.d/*.conf;
}
